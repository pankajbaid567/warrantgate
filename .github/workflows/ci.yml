name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -W ignore -m unittest discover -s tests -t .
      - run: python3 eval/generate.py /tmp/traces.jsonl && cmp /tmp/traces.jsonl eval/suite/traces.jsonl
      - run: python3 eval/run.py --split test
      - run: python3 scripts/mutation_check.py
